# Local PostgreSQL + PostGIS database.
services:
  db:
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hydrosnap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydrosnap}
      POSTGRES_DB: ${POSTGRES_DB:-hydrosnap}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hydrosnap} -d ${POSTGRES_DB:-hydrosnap}"]
      interval: 5s
      timeout: 3s
      retries: 10

  satellite-worker:
    build:
      context: .
      dockerfile: scripts/satellite/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hydrosnap}:${POSTGRES_PASSWORD:-hydrosnap}@db:5432/${POSTGRES_DB:-hydrosnap}
      CLOUD_COVER_LIMIT: ${CLOUD_COVER_LIMIT:-30}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
