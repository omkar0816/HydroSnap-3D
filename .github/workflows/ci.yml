name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: hydrosnap
          POSTGRES_PASSWORD: hydrosnap
          POSTGRES_DB: hydrosnap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydrosnap -d hydrosnap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hydrosnap:hydrosnap@localhost:5432/hydrosnap
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/satellite/requirements.txt
      - run: python -m pytest -q scripts/satellite
